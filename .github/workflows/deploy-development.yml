      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test --configuration Release --no-restore --verbosity normal

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2: Build y Push de imagen Docker
  # ══════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extraer metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3: Deploy usando docker compose
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar al servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            # Login a GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # Ir a la carpeta del proyecto
            cd /opt/Paradox
            
            # Descargar nuevas imagenes y reiniciar servicios
            docker compose pull
            docker compose up -d
            
            # Verificar estado
            docker compose ps
            
            # Limpiar imagenes sin usar
            docker image prune -f --filter "until=24h" || true
            
            echo "Deploy completado exitosamente"
