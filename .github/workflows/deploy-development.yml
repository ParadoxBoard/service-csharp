name: Build and Deploy to Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 1: Build y Tests
  # ══════════════════════════════════════════════════════════════════════════════
