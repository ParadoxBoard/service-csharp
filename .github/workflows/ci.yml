name: CI Pipeline

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 1: Build y Tests
  # ══════════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test --configuration Release --no-restore --verbosity normal

      - name: Subir coverage reports
        run: echo "Coverage reports would be uploaded here"

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2: Security Scan
  # ══════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Build imagen para escaneo
        run: docker build -t paradoxboard/service-csharp:scan .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paradoxboard/service-csharp:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3: Build Verification
  # ══════════════════════════════════════════════════════════════════════════════
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: paradoxboard/service-csharp:test
          cache-from: type=gha

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 4: CI Success
  # ══════════════════════════════════════════════════════════════════════════════
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, build-verification]
    if: success()
    steps:
      - name: CI completado exitosamente
        run: |
          echo "CI Pipeline completado exitosamente"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
