# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                        CI PIPELINE - .NET/C#                                ║
# ║  Se ejecuta en Pull Requests para validar codigo antes del merge            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: CI Pipeline

on:
  pull_request:
    branches: [production, development, main]
  push:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Build
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true # CORREGIDO: Habilita la caché correctamente (true/false)

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Tests
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Ejecutar tests
        run: dotnet test --configuration Release --no-restore --verbosity normal

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Security Scan (Trivy) - CORREGIDO
  # ════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Necesario si quieres subir reportes a GitHub Security

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # PASO NUEVO: Necesario construir la imagen antes de escanearla
      # NOTA: Usamos minúsculas en el nombre de la imagen (paradoxboard)
      - name: Construir imagen para escaneo
        run: docker build -t paradoxboard/service-csharp:scan .

      - name: Escanear vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paradoxboard/service-csharp:scan' # CORREGIDO: Minúsculas
          format: 'table'
          exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades críticas
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ════════════════════════════════════════════════════════════════════════════
  # Resumen final
  # ════════════════════════════════════════════════════════════════════════════
  ci-success:
    name: CI Success
    needs: [build, test, security] # Agregamos security a los requerimientos
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Verificar estado de jobs
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build falló"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests fallaron"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security check falló"
            exit 1
          fi
          echo "Todos los checks pasaron exitosamente"